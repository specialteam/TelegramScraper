[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-channel-scraper"
version = "2.0.0"
description = "Scrape public Telegram channels without API keys or login — Python library, CLI, MCP server for AI agents, and dashboard."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "specialteam" }]
keywords = [
  "telegram", "scraper", "telegram-scraper", "telegram-channel", "web-scraping", "osint",
  "mcp", "mcp-server", "model-context-protocol", "ai-agent", "claude", "llm-tools", "crawler", "t.me",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Communications :: Chat",
  "Environment :: Console",
  "Framework :: AsyncIO",
]
dependencies = ["httpx[socks]>=0.27", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
mcp = ["mcp>=1.2; python_version>='3.10'"]
dashboard = ["streamlit>=1.35"]
all = ["telegram-channel-scraper[excel,mcp,dashboard]"]
dev = ["telegram-channel-scraper[excel,mcp]", "pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21", "flake8"]

[project.scripts]
tgscraper = "tgscraper.cli:main"
tgscraper-mcp = "tgscraper.mcp_server:main"

[project.urls]
Homepage = "https://github.com/specialteam/TelegramScraper"
Issues = "https://github.com/specialteam/TelegramScraper/issues"

[tool.setuptools]
packages = ["tgscraper"]
py-modules = ["telegram_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
