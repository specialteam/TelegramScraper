name: Publish to PyPI

# Releases https://pypi.org/p/telegram-channel-scraper with PyPI Trusted Publishing (no API token stored).
# To release: bump `version` in pyproject.toml and merge to main (or push a v* tag, or run manually).
# An already-published version is skipped, so unrelated edits are harmless.
# A GitHub release v<version> is created with the matching CHANGELOG.md section as notes.
on:
  push:
    branches: [main]
    paths: [pyproject.toml, CHANGELOG.md, .github/workflows/publish.yml]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install build twine
    - run: python -m build
    - run: twine check dist/*
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/telegram-channel-scraper
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        TAG="v$VERSION"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists"; exit 0
        fi
        awk -v v="$VERSION" '$0 ~ "^## "v"$"{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
        printf '\n---\n**PyPI:** https://pypi.org/project/telegram-channel-scraper/%s/\n' "$VERSION" >> notes.md
        gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
