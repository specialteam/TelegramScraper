name: Publish to PyPI

# Releases https://pypi.org/p/telegram-channel-scraper with PyPI Trusted Publishing (no API token stored).
# To release: bump `version` in pyproject.toml and merge to main (or push a v* tag, or run manually).
# An already-published version is skipped, so unrelated edits to pyproject.toml are harmless.
on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/publish.yml]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install build twine
    - run: python -m build
    - run: twine check dist/*
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/telegram-channel-scraper
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
